name: Build

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --dir apps/api exec nest build

      - name: Check Docker image prerequisites
        id: docker-prerequisites
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -f Dockerfile && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker image publishing is skipped. Add a root Dockerfile and set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
          fi

      - name: Set up Docker Buildx
        if: steps.docker-prerequisites.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker-prerequisites.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image tags
        if: steps.docker-prerequisites.outputs.enabled == 'true'
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/edupro-api
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        if: steps.docker-prerequisites.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}

      - name: Report skipped image publishing
        if: steps.docker-prerequisites.outputs.enabled != 'true'
        run: |
          {
            echo '### Docker image publishing skipped'
            echo 'The API build passed, but no Docker image was pushed.'
            echo 'Add a root Dockerfile and configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to enable publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
