name: Verify

on:
  push:
    branches-ignore:
      - main
      - develop
    tags-ignore:
      - '*'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: YAML, type checks, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all YAML files
        run: pnpm check:yaml

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Type check API
        run: pnpm --dir apps/api exec tsc --noEmit --pretty false

      - name: Run API tests
        run: pnpm --dir apps/api exec jest --runInBand --coverage=false
